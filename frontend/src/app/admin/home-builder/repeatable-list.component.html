<div class="flex flex-col gap-3">
  @if (label()) {
    <label class="field-label">{{ label() }}</label>
  }
  @for (item of items(); track $index) {
    <div class="flex items-start gap-2 rounded-md border border-border p-3">
      <div class="min-w-0 flex-1">
        <ng-container [ngTemplateOutlet]="rowTemplate()" [ngTemplateOutletContext]="templateContext(item, $index)" />
      </div>
      <button type="button" class="repeatable-list-remove btn-ghost btn-sm shrink-0" (click)="remove.emit($index)">
        {{ removeLabel() ?? defaultRemoveLabel }}
      </button>
    </div>
  }
  <button type="button" class="repeatable-list-add btn-outline btn-sm self-start" (click)="add.emit()">
    {{ addLabel() ?? defaultAddLabel }}
  </button>
</div>
