<!-- Change 20260726 -->
<div class="withdraw-backdrop" (click)="cancel()"></div>
<div class="withdraw-panel" role="dialog" aria-modal="true" aria-labelledby="withdraw-title">
  <h2 id="withdraw-title" class="section-title" i18n="@@ideas.withdraw.title">Withdraw idea</h2>

  @if (ideaTitle) {
    <p class="page-subtitle">{{ ideaTitle }}</p>
  }

  <p class="mt-3 text-sm text-foreground" i18n="@@ideas.withdraw.confirm">
    Are you sure you want to withdraw this idea? This action cannot be undone.
  </p>

  <label
    class="field-label mt-4 block"
    for="withdraw-reason"
    i18n="@@ideas.withdraw.reasonLabel"
  >Reason (optional)</label>
  <textarea
    id="withdraw-reason"
    rows="3"
    class="field-textarea mt-1"
    [ngModel]="reason()"
    (ngModelChange)="reason.set($event)"
    [disabled]="saving()"
  ></textarea>

  @if (error()) {
    <p class="mt-3 rounded-md bg-red-50 p-3 text-sm text-red-700" role="alert">{{ error() }}</p>
  }

  <div class="mt-5 flex justify-end gap-2">
    <button
      type="button"
      class="btn-outline btn-sm"
      (click)="cancel()"
      [disabled]="saving()"
      i18n="@@ideas.withdraw.cancel"
    >Cancel</button>
    <button type="button" class="btn-destructive btn-sm" (click)="confirm()" [disabled]="saving()">
      @if (saving()) {
        <span i18n="@@ideas.withdraw.working">Withdrawing…</span>
      } @else {
        <span i18n="@@ideas.withdraw.submit">Confirm withdrawal</span>
      }
    </button>
  </div>
</div>
