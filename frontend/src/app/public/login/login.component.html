<!-- Change 20260726 -->
<div class="mx-auto flex max-w-md flex-col gap-6 py-12">
  <div class="text-center">
    <h1 class="text-2xl font-semibold text-foreground" i18n="@@loginTitle">Sign in</h1>
    <!-- Change 20260726 -->
    <p class="mt-1 text-sm text-muted-foreground" i18n="@@authSignInWithGac">
      Sign in with your GAC account. <!-- Change 20260726 -->
    </p>
  </div>

  <section class="card-surface card-body flex flex-col gap-4">
    @if (errorMessage(); as msg) {
      <div class="field-error" role="alert">{{ msg }}</div>
    }

    <!-- Change 20260726 -->
    <p class="text-sm text-muted-foreground" i18n="@@authSignInWithGacHint">
      Your Windows/Active Directory credentials are used automatically — no password is entered here. <!-- Change 20260726 -->
    </p>

    <!-- Change 20260726 -->
    <button
      type="button"
      class="btn-default w-full"
      [disabled]="submitting()"
      (click)="signInWithGac()"
      i18n="@@authContinueWithGac"
    >
      Continue with GAC <!-- Change 20260726 -->
    </button>
  </section>
</div>
