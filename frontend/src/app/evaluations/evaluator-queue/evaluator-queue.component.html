<app-page-header title="Evaluation Queue" i18n-title="@@evaluatorQueueTitle" />

@if (loading()) {
  <app-loading-state variant="skeleton" [rows]="3" />
} @else if (error(); as e) {
  <app-error-state [message]="e" (retry)="reload()" />
} @else if (queue().length === 0) {
  <app-empty-state title="There are no ideas awaiting your evaluation." i18n-title="@@evaluatorQueueEmpty" icon="clipboard-check" />
} @else {
  <ul class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3">
    @for (item of queue(); track item.id) {
      <li class="card-surface card-body flex flex-col gap-2">
        <!-- Change 20260726 -->
        @if (isOwnIdea(item.id)) {
          <div class="flex cursor-not-allowed flex-col gap-2 opacity-60" [title]="ownIdeaTooltip">
            <span class="text-xs font-medium text-brand-gold">{{ item.code }} — {{ item.titleAr }}</span>
            <span class="text-xs font-medium text-muted-foreground" i18n="@@evaluatorQueueOwnIdea">Your own idea</span>
          </div>
        } @else {
          <a [routerLink]="['/evaluations', item.id]" class="flex flex-col gap-2">
            <span class="text-xs font-medium text-brand-gold">{{ item.code }} — {{ item.titleAr }}</span>
          </a>
        }
      </li>
    }
  </ul>
}
